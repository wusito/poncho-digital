{% load static %}
                    <!--SECCIÓN 5: ALTA DE UN PRODUCTO -->
                    <section class="container-fluid py-4 px-0" id="agregar-producto">

                        <!-- ENCABEZADO -->
                        <div class="p-4 p-md-5 rounded hero shadow-lg border-top border-4" style="border-color: var(--color-rojo) !important;">
                            <div class="text-center mb-4 row justify-content-center">
                                <h2 style="font-family: var(--fuente-titulos); color: var(--color-rojo-oscuro);" class="fw-bold">Cargar un Producto</h2>
                                <p class="text-muted mx-auto" style="max-width: 60ch;">Registra un nuevo producto completando el formulario para publicarlo en el sistema.</p>
                            </div>

                            <form id="form-alta-producto" method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="row justify-content-center">
                                    <fieldset class="col-12 col-md-10 shadow-sm rounded border-top border-1 p-4 p-md-5 bg-white" style="border-color: var(--color-ocre) !important;">
                                        <legend class="float-none w-auto px-3 h5 fw-bold" style="font-family: var(--fuente-titulos); color: var(--color-rojo);">Datos del Producto</legend>

                                        <div class="row g-3">
                                            <!-- Nombre del producto -->
                                            <div class="col-md-12 position-relative form-grupo">
                                                <label 
                                                    class="form-label fw-semibold" 
                                                    for="nombre">Nombre del producto:</label>
                                                <input 
                                                    class="form-control form-campo-claro" 
                                                    type="text" 
                                                    name="nombre" 
                                                    id="nombre" 
                                                    placeholder="Ej: Poncho" 
                                                    required>
                                            </div>

                                            <!-- Descripción del producto -->
                                            <div class="col-md-12 position-relative form-grupo">
                                                <label 
                                                    class="form-label fw-semibold"
                                                    for="descripcion">Descripción del producto:</label>
                                                <textarea 
                                                    class="form-control form-campo-claro" 
                                                    name="descripcion" 
                                                    id="descripcion" 
                                                    rows="4" 
                                                    placeholder="Detalla las características del producto..." 
                                                    required></textarea>
                                            </div>

                                            <!-- Categoría del producto -->
                                            <div class="col-md-12 position-relative form-grupo">
                                                <label class="fw-semibold mb-2" for="categoria">Selecciona la categoría del producto:</label>
                                                
                                                <div class="col-12 position-relative">
                                                    <select class="form-select form-campo-claro" name="categoria" id="categoria" aria-label="Default select example">
                                                        <option value="textiles-tradicionales">Textiles Tradicionales</option>
                                                        <option value="artesanias-articulos-hogar">Artesanías y Artículos para el Hogar</option>
                                                        <option value="productos-regionales-delicatessen">Productos Regionales y Delicatessen</option>
                                                        <option value="sector-comercial">Sector Comercial</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <!-- Subcategoría del producto: deshabilitada -->
                                            <div class="col-md-12 position-relative form-grupo">
                                                <label class="fw-semibold mb-2" for="subcategoria">Selecciona la subcategoría del producto:</label>

                                                <div class="col-12 position-relative">
                                                    <select class="form-select form-campo-claro" name="subcategoria" id="subcategoria" aria-label="Default select example" disabled>
                                                    <option value="">Selecciona primero una categoría.</option>
                                                </select>
                                                </div>
                                            </div>

                                            <!-- Stock del producto -->
                                            <div class="col-md-12 position-relative form-grupo">
                                                <label 
                                                    class="form-label fw-semibold" 
                                                    for="stock">Stock (cantidad) del producto:</label>
                                                <input 
                                                    class="form-control form-campo-claro" 
                                                    type="number" 
                                                    name="stock" 
                                                    id="stock" 
                                                    placeholder="Ej: 5" 
                                                    required>
                                            </div>

                                            <!-- Precio unitario del producto -->
                                            <div class="col-md-12 position-relative form-grupo">
                                                <label
                                                    class="form-label fw-semibold"
                                                    for="precio_unitario">Precio del producto (por unidad):</label>
                                                <input
                                                    class="form-control form-campo-claro"
                                                    type="number" 
                                                    name="precio_unitario" 
                                                    id="precio_unitario" 
                                                    placeholder="Ej: 850000" 
                                                    required>
                                            </div>

                                            <!-- Imagen del producto -->
                                            <div class="col-md-12 position-relative form-grupo">
                                                <label 
                                                    class="form-label fw-semibold"
                                                    for="imagen">Imagen del producto:</label>
                                                <input 
                                                    class="form-control form-campo-claro"
                                                    type="file" 
                                                    name="imagen" 
                                                    id="imagen" 
                                                    accept="image/*" 
                                                    required>
                                            </div>
                                        </div>

                                        <!-- Botones -->
                                        <div class="row justify-content-center form-acciones mt-4">
                                            <div class="col-md-5 mb-3 mb-md-0">
                                                <button 
                                                    class="boton boton-fantasma w-100" 
                                                    type="reset">
                                                    Limpiar Formulario
                                                </button>
                                            </div>
                                            <div class="col-md-5">
                                                <button 
                                                    class="boton boton-primario w-100"
                                                    type="submit">
                                                    Publicar Producto
                                                </button>
                                            </div>
                                        </div>
                                    </fieldset>
                                </div>
                            </form>
                        </div>
                    </section>
